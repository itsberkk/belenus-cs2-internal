<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 130" width="1280" height="130" role="img" aria-label="Source is private, this repository is a showcase">
<defs>
  <linearGradient id="w" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0"><stop offset="0" stop-color="#4f9dff"/><stop offset="1" stop-color="#f078b8"/></linearGradient>
  <clipPath id="c"><rect width="1280" height="130" rx="24"/></clipPath>
</defs>
<style>
.w1{animation:m 14s linear infinite}
.w2{animation:m 22s linear infinite reverse}
.w3{animation:m 30s linear infinite}
