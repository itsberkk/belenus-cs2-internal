</style>
<text x="640" y="30" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#7f8ea8">SOURCE IS PRIVATE · THIS REPOSITORY IS A SHOWCASE</text>
<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="130">
  <g fill="#fff">
    <g opacity=".22"><path class="w3" d="M0 80 Q160 54 320 80 T640 80 T960 80 T1280 80 T1600 80 T1920 80 T2240 80 T2560 80 T2880 80 T3200 80 V130 H0 Z"/></g>
    <g opacity=".34" transform="translate(-210 0)"><path class="w2" d="M0 92 Q160 62 320 92 T640 92 T960 92 T1280 92 T1600 92 T1920 92 T2240 92 T2560 92 T2880 92 T3200 92 V130 H0 Z"/></g>
    <g opacity=".60"><path class="w1" d="M0 104 Q160 82 320 104 T640 104 T960 104 T1280 104 T1600 104 T1920 104 T2240 104 T2560 104 T2880 104 T3200 104 V130 H0 Z"/></g>
  </g>
</mask>
<g clip-path="url(#c)"><rect width="1280" height="130" fill="url(#w)" mask="url(#m)"/></g>
</svg>
