<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70" role="img" aria-label="Features">
<defs>
  <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="350" y1="0" x2="650" y2="0"><stop offset="0" stop-color="#4f9dff"/><stop offset="1" stop-color="#f078b8"/></linearGradient>
  <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#4f9dff" stop-opacity="0"/><stop offset="1" stop-color="#4f9dff"/></linearGradient>
  <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#f078b8"/><stop offset="1" stop-color="#f078b8" stop-opacity="0"/></linearGradient>
</defs>
<style>
.g1{animation:g1 3.6s ease-in-out infinite}
.g2{animation:g2 3.6s ease-in-out infinite}
@keyframes g1{0%{transform:translateX(40px);opacity:0}30%{opacity:1}100%{transform:translateX(318px);opacity:0}}
@keyframes g2{0%{transform:translateX(-40px);opacity:0}30%{opacity:1}100%{transform:translateX(-318px);opacity:0}}
@media (prefers-reduced-motion:reduce){.g1,.g2{animation:none;opacity:0}}
</style>
<rect x="0" y="34" width="320" height="2" rx="1" fill="url(#a)"/>
<rect x="680" y="34" width="320" height="2" rx="1" fill="url(#b)"/>
<circle class="g1" cx="0" cy="35" r="3" fill="#8ec5ff"/>
<circle class="g2" cx="1000" cy="35" r="3" fill="#ff9bd3"/>
<text x="505" y="44" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="10" fill="url(#t)">FEATURES</text>
</svg>
