<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Belenus, a semi-rage Counter-Strike 2 internal with a real-time 3D interface">
<defs>
  <clipPath id="c"><rect width="1280" height="400" rx="24"/></clipPath>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <linearGradient id="arc" x1="0" x2="1"><stop offset=".12" stop-color="#f0c47a" stop-opacity="0"/><stop offset=".5" stop-color="#ffe7bd" stop-opacity=".85"/><stop offset=".88" stop-color="#f0c47a" stop-opacity="0"/></linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset=".2" stop-color="#ffffff"/><stop offset="1" stop-color="#e6d9c0"/></linearGradient>
</defs>
<style>
.glow{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.34}}
.spark{stroke-dasharray:90 6000;stroke-dashoffset:-3640;animation:run 9s ease-in-out infinite}
@keyframes run{0%{stroke-dashoffset:-3640;opacity:0}12%{opacity:.95}48%{opacity:.95}60%,100%{stroke-dashoffset:-4830;opacity:0}}
.rise{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
.r2{animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.glow,.spark,.rise{animation:none}.spark{opacity:0}}
</style>
<g clip-path="url(#c)">
  <rect width="1280" height="400" fill="#0e0f11"/>
  <ellipse class="glow" cx="640" cy="470" rx="520" ry="200" fill="#f0c47a" opacity=".22" filter="url(#b)"/>
  <circle cx="640" cy="1215" r="900" fill="none" stroke="url(#arc)" stroke-width="1.3"/>
  <circle class="spark" cx="640" cy="1215" r="900" fill="none" stroke="#fff6e2" stroke-width="2" stroke-linecap="round"/>
  <text class="rise" x="640" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="124" font-weight="600" letter-spacing="-4" fill="url(#word)">Belenus</text>
  <text class="rise r2" x="640" y="254" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19.5" fill="#a1a3aa">A semi-rage Counter-Strike 2 internal with a real-time 3D interface</text>
</g>
<rect x=".5" y=".5" width="1279" height="399" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
