<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="nova, a Counter-Strike 2 internal with a real-time 3D interface">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b11"/><stop offset="1" stop-color="#0f1728"/></linearGradient>
  <clipPath id="clip"><rect width="1280" height="420" rx="28"/></clipPath>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="72"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#9dbcff" stroke-opacity=".10"/></pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gm"><rect width="1280" height="420" fill="url(#fade)"/></mask>
  <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="440" y1="0" x2="850" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#8ec5ff"/><stop offset="1" stop-color="#ff8fd0"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ec5ff" stop-opacity=".6"/><stop offset=".5" stop-color="#8ec5ff" stop-opacity=".06"/><stop offset="1" stop-color="#ff8fd0" stop-opacity=".5"/></linearGradient>
  <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#8ec5ff" stop-opacity="0"/><stop offset=".5" stop-color="#8ec5ff"/><stop offset="1" stop-color="#ff8fd0" stop-opacity="0"/></linearGradient>
  <linearGradient id="swg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="sw" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="420"><g class="sweep"><rect x="-260" y="60" width="180" height="230" fill="url(#swg)" transform="skewX(-18)"/></g></mask>
</defs>
<style>
.b1{animation:d1 16s ease-in-out infinite alternate}
.b2{animation:d2 21s ease-in-out infinite alternate}
.b3{animation:d3 18s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(150px,70px)}}
@keyframes d2{to{transform:translate(-190px,-80px)}}
@keyframes d3{to{transform:translate(110px,120px)}}
.sweep{animation:sw 7s ease-in-out infinite}
@keyframes sw{0%,45%{transform:translateX(0)}100%{transform:translateX(1700px)}}
.l{opacity:0;animation:cyc 9s infinite}
.l2{animation-delay:3s}
.l3{animation-delay:6s}
@keyframes cyc{0%{opacity:0;transform:translateY(12px)}5%,30%{opacity:1;transform:translateY(0)}35%,100%{opacity:0;transform:translateY(-12px)}}
.dot{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.b1,.b2,.b3,.sweep,.dot,.l{animation:none}.l1{opacity:1}}
</style>
<g clip-path="url(#clip)">
  <rect width="1280" height="420" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <circle class="b1" cx="240" cy="110" r="180" fill="#2f6bff" opacity=".55"/>
    <circle class="b2" cx="1060" cy="340" r="200" fill="#e0489a" opacity=".42"/>
    <circle class="b3" cx="700" cy="-40" r="150" fill="#19c2e6" opacity=".32"/>
  </g>
  <rect width="1280" height="420" fill="url(#grid)" mask="url(#gm)"/>
  <g fill="none" stroke="#9dbcff" stroke-opacity=".5" stroke-width="1.5">
    <path d="M26 62V40a14 14 0 0 1 14-14h22"/>
    <path d="M1254 62V40a14 14 0 0 0-14-14h-22"/>
    <path d="M26 358v22a14 14 0 0 0 14 14h22"/>
    <path d="M1254 358v22a14 14 0 0 1-14 14h-22"/>
  </g>
  <g font-family="ui-monospace,'Cascadia Code',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="2.5" fill="#9db2d6" opacity=".8">
    <text x="84" y="50">NOVA // SHOWCASE</text>
    <text x="1196" y="50" text-anchor="end">C++20 · DIRECTX 11 · SOURCE 2</text>
    <text x="104" y="381">IN DEVELOPMENT</text>
    <text x="1196" y="381" text-anchor="end">AFTERGLOW UI</text>
  </g>
  <circle class="dot" cx="89" cy="376" r="4.5" fill="#4cc96b"/>
  <text x="640" y="104" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="8" fill="#a9bbdc">COUNTER-STRIKE 2 INTERNAL</text>
  <g text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="172" font-weight="800" letter-spacing="-5">
    <text x="640" y="240" fill="#6cb7ff" opacity=".55" filter="url(#glow)">nova</text>
    <text x="640" y="240" fill="url(#word)">nova</text>
    <text x="640" y="240" fill="#fff" mask="url(#sw)">nova</text>
  </g>
  <rect x="460" y="272" width="360" height="2" rx="1" fill="url(#rule)"/>
  <g font-family="ui-monospace,'Cascadia Code',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="23" font-weight="600" text-anchor="middle">
    <text class="l l1" x="640" y="324" fill="#8ec5ff">a renderer inside the menu</text>
    <text class="l l2" x="640" y="324" fill="#ff9bd3">engine-level materials, built at run time</text>
    <text class="l l3" x="640" y="324" fill="#ffd479">what you see is what you get</text>
  </g>
</g>
<rect x=".75" y=".75" width="1278.5" height="418.5" rx="27.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
