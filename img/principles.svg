rial,sans-serif" font-size="15.5" fill="#a1a3aa">Chams are real Source 2 materials,</text><text x="364" y="137" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#a1a3aa">built at run time and swapped into</text><text x="364" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#a1a3aa">the scene per mesh.</text><rect x="680.5" y=".5" width="319" height="183" rx="16" fill="#0e0f11" stroke="#fff" stroke-opacity=".08"/><g transform="translate(704 24) scale(1.15)" fill="none" stroke="#f0c47a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 2.5 8l9.5 5 9.5-5z"/><path d="M2.5 12.5l9.5 5 9.5-5"/><path d="M2.5 17l9.5 5 9.5-5"/></g><text x="704" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18.5" font-weight="600" fill="#f4f4f5">One source of truth</text><text x="704" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#a1a3aa">Every setting lives in one generated</text><text x="704" y="137" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#a1a3aa">table. Profiles, binds and search</text><text x="704" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#a1a3aa">all read it.</text>
